name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  swift:
    name: SwiftPM build + test
    runs-on: macos-latest
    env:
      SWIFTLINT_VERSION: "0.57.1"
      TERRA_SWIFTPM_TIMEOUT_SECONDS: "900"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version

      - name: Install SwiftLint
        run: |
          set -euo pipefail
          curl -sSLo SwiftLint.pkg "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/SwiftLint.pkg"
          sudo installer -pkg SwiftLint.pkg -target /
          rm -f SwiftLint.pkg
          test "$(swiftlint version)" = "${SWIFTLINT_VERSION}"

      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      - name: Repository validation
        run: |
          set -euo pipefail
          bash Scripts/validate_no_legacy_refs.sh
          python3 Scripts/validate-doc-snippets.py
          if [ -f Scripts/validate-telemetry-schema.py ]; then python3 Scripts/validate-telemetry-schema.py; fi
          if [ -f Scripts/validate-bindings.py ]; then python3 Scripts/validate-bindings.py; fi

      - name: SwiftPM tests
        run: Scripts/validate-swiftpm.sh

      - name: API breaking changes (SDK targets, PRs only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          swift package diagnose-api-breaking-changes Terra
          swift package diagnose-api-breaking-changes TerraCore
          swift package diagnose-api-breaking-changes TerraCoreML
          swift package diagnose-api-breaking-changes TerraTraceKit
          swift package diagnose-api-breaking-changes TerraHTTPInstrument
          swift package diagnose-api-breaking-changes TerraFoundationModels
          swift package diagnose-api-breaking-changes TerraMLX
          swift package diagnose-api-breaking-changes TerraMetalProfiler
          swift package diagnose-api-breaking-changes TerraSystemProfiler
          swift package diagnose-api-breaking-changes TerraLlama
          swift package diagnose-api-breaking-changes TerraAccelerate
          swift package diagnose-api-breaking-changes TerraTracedMacro

  native-bindings:
    name: Zig, Rust, and Python bindings
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        run: |
          set -euo pipefail
          brew install zig

      - name: Zig tests
        run: |
          set -euo pipefail
          cd zig-core
          zig build test --summary all

      - name: Rust tests
        run: |
          set -euo pipefail
          cd terra-rust
          cargo test -- --test-threads=1

      - name: Python syntax check
        run: |
          set -euo pipefail
          python3 -m py_compile terra-python/terra.py

  android:
    name: Android bindings
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle tests and release assembly
        run: |
          set -euo pipefail
          cd terra-android
          ./gradlew test assembleRelease
